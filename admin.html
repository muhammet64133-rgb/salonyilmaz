<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Yılmaz | Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { brand: '#a3ff12', 'brand-dark': '#0d0d0d', 'brand-card': '#141416', 'brand-border': '#222226' }
        }
      }
    }
  </script>
</head>
<body class="bg-[#08080a] text-white font-body min-h-screen pb-20">

  <!-- Header -->
  <header class="border-b border-white/10 bg-[#0d0d0d] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-brand font-black text-xl tracking-wider uppercase">Salon Yılmaz</span>
        <span class="text-xs bg-brand/10 text-brand px-2.5 py-1 rounded-full font-bold">Yönetim Paneli</span>
      </div>
      <button id="save-github-btn" type="button" class="bg-brand text-black font-extrabold px-6 py-2 rounded-full text-xs uppercase tracking-wider hover:shadow-[0_0_20px_rgba(163,255,18,0.5)] transition cursor-pointer flex items-center gap-2">
        💾 GitHub'a Doğrudan Kaydet
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- GİTHUB BAĞLANTI AYARLARI (İşte Aradığınız Kutu Burada!) -->
    <section class="bg-brand-card border border-brand/30 rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-2">🔑 GitHub Otomatik Kayıt Ayarları</h2>
      <p class="text-xs text-white/60 mb-4">Bu alanları 1 defa doldurduğunuzda tarayıcınız hatırlar.</p>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">GitHub Kullanıcı Adınız</label>
          <input type="text" id="gh-username" placeholder="Örn: ahmet123" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Repo (Proje) Adı</label>
          <input type="text" id="gh-repo" placeholder="Örn: salon-yilmaz" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Personal Access Token</label>
          <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
      </div>
    </section>

    <!-- HERO BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">Ana Sayfa (Giriş) Alanı</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase text-white/60 mb-2">Model Resmi Değiştir</label>
          <div class="flex items-center gap-4">
            <img id="hero-preview" src="" class="w-20 h-20 object-cover rounded-lg border border-brand-border bg-black/50">
            <input type="file" id="hero-file-input" accept="image/*" class="text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brand file:text-black hover:file:bg-brand/80 cursor-pointer">
          </div>
          <p id="hero-upload-status" class="text-xs text-brand mt-2 hidden">Resim yükleniyor...</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Başlık Satır 1</label>
            <input type="text" id="hero-title-1" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
          </div>
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Başlık Satır 2 (Yeşil)</label>
            <input type="text" id="hero-title-2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Açıklama Metni</label>
          <textarea id="hero-description" rows="2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none"></textarea>
        </div>
      </div>
    </section>

    <!-- HİZMETLER BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">Hizmet Kartları</h2>
      <div id="services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- GALERİ RESİMLERİ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
        <h2 class="text-lg font-bold text-brand uppercase">Galeri Fotoğrafları</h2>
        <label class="cursor-pointer text-xs bg-brand text-black font-bold px-3 py-1.5 rounded-lg hover:bg-brand/80 transition">
          + Yeni Fotoğraf Yükle
          <input type="file" id="gallery-file-input" accept="image/*" class="hidden" multiple>
        </label>
      </div>
      <p id="gallery-upload-status" class="text-xs text-brand mb-3 hidden">Resimler yükleniyor...</p>
      <div id="gallery-preview-container" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
    </section>

    <!-- İLETİŞİM BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">İletişim Bilgileri</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Telefon Numarası</label>
          <input type="text" id="contact-phone" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Çalışma Saatleri</label>
          <input type="text" id="contact-hours" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs uppercase text-white/60 mb-1">Adres</label>
          <input type="text" id="contact-address" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
      </div>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
  </html>
