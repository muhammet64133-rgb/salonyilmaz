<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Yılmaz | Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { brand: '#a3ff12', 'brand-dark': '#0d0d0d', 'brand-card': '#141416', 'brand-border': '#222226' }
        }
      }
    }
  </script>
</head>
<body class="bg-[#08080a] text-white font-body min-h-screen pb-20">

  <!-- Header -->
  <header class="border-b border-white/10 bg-[#0d0d0d] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-brand font-black text-xl tracking-wider uppercase">Salon Yılmaz</span>
        <span class="text-xs bg-brand/10 text-brand px-2.5 py-1 rounded-full font-bold">Görsel &amp; İçerik Paneli</span>
      </div>
      <button id="save-all-btn" class="bg-brand text-black font-extrabold px-6 py-2 rounded-full text-xs uppercase tracking-wider hover:shadow-[0_0_20px_rgba(163,255,18,0.5)] transition">
        Değişiklikleri Kaydet
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- HERO BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">Ana Sayfa Büyük Model Resim &amp; Başlıklar</h2>
      
      <div class="space-y-4">
        <!-- Resim Yükleme Alanı -->
        <div>
          <label class="block text-xs uppercase text-white/60 mb-2">Model Resmi Değiştir (Cihazından Seç)</label>
          <div class="flex items-center gap-4">
            <img id="hero-preview" src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?q=80&w=1000&auto=format&fit=crop" class="w-20 h-20 object-cover rounded-lg border border-brand-border">
            <input type="file" id="hero-file-input" accept="image/*" class="text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brand file:text-black hover:file:bg-brand/80 cursor-pointer">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Başlık 1. Satır</label>
            <input type="text" id="hero-title-1" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="TARZINI">
          </div>
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Başlık 2. Satır (Yeşil)</label>
            <input type="text" id="hero-title-2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="YÜKSELT">
          </div>
        </div>

        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Açıklama Metni</label>
          <textarea id="hero-description" rows="2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">Erkeklerin yeni nesil duruşu. Özenli bakım, keskin stil.</textarea>
        </div>
      </div>
    </section>

    <!-- GALERİ RESİMLERİ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
        <h2 class="text-lg font-bold text-brand uppercase">Galeri Fotoğrafları</h2>
        <label class="cursor-pointer text-xs bg-brand text-black font-bold px-3 py-1.5 rounded-lg hover:bg-brand/80 transition">
          + Yeni Fotoğraf Yükle
          <input type="file" id="gallery-file-input" accept="image/*" class="hidden" multiple>
        </label>
      </div>

      <div id="gallery-preview-container" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <!-- Yüklenen galeri resimleri buraya gelecek -->
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
