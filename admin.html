<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Yılmaz | Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { brand: '#a3ff12', 'brand-dark': '#0d0d0d', 'brand-card': '#141416', 'brand-border': '#222226' }
        }
      }
    }
  </script>
</head>
<body class="bg-[#08080a] text-white font-body min-h-screen pb-20">

  <!-- Header -->
  <header class="border-b border-white/10 bg-[#0d0d0d] sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-brand font-black text-xl tracking-wider uppercase">Salon Yılmaz</span>
        <span class="text-xs bg-brand/10 text-brand px-2.5 py-1 rounded-full font-bold">Yazı Paneli</span>
      </div>
      <button id="generate-code-btn" type="button" class="bg-brand text-black font-extrabold px-6 py-2 rounded-full text-xs uppercase tracking-wider hover:shadow-[0_0_20px_rgba(163,255,18,0.5)] transition cursor-pointer">
        ⚡ Kodu Üret
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- KOD ÇIKTI ALANI (Başlangıçta Gizli) -->
    <section id="code-output-section" class="hidden bg-brand/10 border border-brand/40 rounded-xl p-6">
      <h2 class="text-sm font-bold text-brand uppercase mb-2">📋 Oluşturulan Kodu Kopyalayın:</h2>
      <p class="text-xs text-white/70 mb-3">Aşağıdaki kutunun içindeki tüm yazıları kopyalayıp GitHub'daki <b>data.js</b> dosyasına yapıştırın.</p>
      <textarea id="code-output-box" rows="8" readonly class="w-full bg-black border border-brand/30 rounded-lg p-3 text-xs font-mono text-brand focus:outline-none select-all"></textarea>
    </section>

    <!-- HERO BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">1. Ana Sayfa Başlık ve Açıklamaları</h2>
      
      <div class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Başlık Satır 1</label>
            <input type="text" id="hero-title-1" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
          </div>
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Başlık Satır 2 (Yeşil Yazı)</label>
            <input type="text" id="hero-title-2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Açıklama Metni</label>
          <textarea id="hero-description" rows="2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none"></textarea>
        </div>
      </div>
    </section>

    <!-- HİZMETLER BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">2. Hizmet Listesi ve Fiyat/Açıklamalar</h2>
      <div id="services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- İLETİŞİM BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6">
      <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">3. İletişim Bilgileri</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Telefon Numarası</label>
          <input type="text" id="contact-phone" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Çalışma Saatleri</label>
          <input type="text" id="contact-hours" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs uppercase text-white/60 mb-1">Adres Bilgisi</label>
          <input type="text" id="contact-address" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">
        </div>
      </div>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
            </html>
