<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Yılmaz | Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { brand: '#a3ff12', 'brand-dark': '#0d0d0d', 'brand-card': '#141416', 'brand-border': '#222226' }
        }
      }
    }
  </script>
</head>
<body class="bg-[#08080a] text-white font-body min-h-screen pb-20">

  <!-- Header -->
  <header class="border-b border-white/10 bg-[#0d0d0d] sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-brand font-black text-xl tracking-wider uppercase">Salon Yılmaz</span>
        <span class="text-xs bg-brand/10 text-brand px-2.5 py-1 rounded-full font-bold">Yazı Paneli</span>
      </div>
      <button onclick="generateCode()" type="button" class="bg-brand text-black font-extrabold px-6 py-2 rounded-full text-xs uppercase tracking-wider hover:shadow-[0_0_20px_rgba(163,255,18,0.5)] transition cursor-pointer">
        ⚡ KODU ÜRET
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- KOD ÇIKTI ALANI -->
    <section id="code-section" class="hidden bg-brand/10 border border-brand/40 rounded-xl p-6">
      <h2 class="text-sm font-bold text-brand uppercase mb-2">📋 Yeni Kodunuz Hazır!</h2>
      <p class="text-xs text-white/70 mb-3">Aşağıdaki siyah kutunun içine dokunun, <b>Hepsini Seç</b> deyip kopyalayın. Ardından GitHub'daki <b>data.js</b> dosyasına yapıştırın.</p>
      <textarea id="code-box" rows="8" readonly class="w-full bg-black border border-brand/30 rounded-lg p-3 text-xs font-mono text-brand focus:outline-none"></textarea>
    </section>

    <!-- HERO BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6 space-y-4">
      <h2 class="text-lg font-bold text-brand uppercase border-b border-white/5 pb-2">1. Ana Sayfa Başlıkları</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Başlık Satır 1</label>
          <input type="text" id="h-title1" value="TARZINI" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm text-white outline-none focus:border-brand">
        </div>
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Başlık Satır 2 (Yeşil)</label>
          <input type="text" id="h-title2" value="YÜKSELT" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm text-white outline-none focus:border-brand">
        </div>
      </div>
      <div>
        <label class="block text-xs uppercase text-white/60 mb-1">Açıklama Metni</label>
        <textarea id="h-desc" rows="2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm text-white outline-none focus:border-brand">Erkeklerin yeni nesil duruşu. Özenli bakım, keskin stil.</textarea>
      </div>
    </section>

    <!-- İLETİŞİM BÖLÜMÜ -->
    <section class="bg-brand-card border border-brand-border rounded-xl p-6 space-y-4">
      <h2 class="text-lg font-bold text-brand uppercase border-b border-white/5 pb-2">2. İletişim Bilgileri</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Telefon</label>
          <input type="text" id="c-phone" value="0507 577 10 22" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm text-white outline-none focus:border-brand">
        </div>
        <div>
          <label class="block text-xs uppercase text-white/60 mb-1">Çalışma Saatleri</label>
          <input type="text" id="c-hours" value="Pzt–Cmt 09:00–21:00" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm text-white outline-none focus:border-brand">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs uppercase text-white/60 mb-1">Adres</label>
          <input type="text" id="c-addr" value="Arda Mahallesi 3205 Sokak 18/B, Manisa" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm text-white outline-none focus:border-brand">
        </div>
      </div>
    </section>

  </main>

  <script>
    function generateCode() {
      var data = {
        hero: {
          title1: document.getElementById('h-title1').value,
          title2: document.getElementById('h-title2').value,
          description: document.getElementById('h-desc').value,
          image: "https://images.unsplash.com/photo-1622286342621-4bd786c2447c?q=80&w=1000&auto=format&fit=crop"
        },
        services: [
          { title: "SAÇ KESİM", desc: "Keskin stiller, mükemmel sonuçlar." },
          { title: "SAKAL & TRAŞ", desc: "Tıraş, şekillendirme ve bakım." },
          { title: "SAÇ & SAKAL BAKIM", desc: "Saç, cilt ve sakal için özenli bakım." },
          { title: "RENKLENDİRME", desc: "Kişiye özel renk çözümleri." }
        ],
        contact: {
          phone: document.getElementById('c-phone').value,
          hours: document.getElementById('c-hours').value,
          address: document.getElementById('c-addr').value
        }
      };

      var output = "window.siteData = " + JSON.stringify(data, null, 2) + ";";
      
      var sec = document.getElementById('code-section');
      var box = document.getElementById('code-box');
      
      box.value = output;
      sec.classList.remove('hidden');
      sec.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
  </html>
