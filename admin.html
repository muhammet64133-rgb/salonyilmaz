<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Yılmaz | Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { brand: '#a3ff12', 'brand-dark': '#0d0d0d', 'brand-card': '#141416', 'brand-border': '#222226' }
        }
      }
    }
  </script>
</head>
<body class="bg-[#08080a] text-white font-body min-h-screen pb-20">

  <!-- Header -->
  <header class="border-b border-white/10 bg-[#0d0d0d] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-brand font-black text-xl tracking-wider uppercase">Salon Yılmaz</span>
        <span class="text-xs bg-brand/10 text-brand px-2.5 py-1 rounded-full font-bold">Yönetim Paneli</span>
      </div>
      <button id="save-all-btn" class="bg-brand text-black font-extrabold px-6 py-2 rounded-full text-xs uppercase tracking-wider hover:shadow-[0_0_20px_rgba(163,255,18,0.5)] transition">
        Değişiklikleri Kaydet
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-8 grid grid-cols-1 md:grid-cols-12 gap-8">
    
    <!-- Sol Menü (Navigasyon) -->
    <aside class="md:col-span-3">
      <div class="bg-brand-card border border-brand-border rounded-xl p-3 sticky top-24 space-y-1 text-sm font-semibold">
        <a href="#sec-hero" class="block px-4 py-2.5 rounded-lg text-brand bg-white/5 hover:bg-white/10 transition">Hero (Giriş) Alanı</a>
        <a href="#sec-services" class="block px-4 py-2.5 rounded-lg text-white/70 hover:text-white hover:bg-white/5 transition">Hizmet Kartları</a>
        <a href="#sec-gallery" class="block px-4 py-2.5 rounded-lg text-white/70 hover:text-white hover:bg-white/5 transition">Galeri Görselleri</a>
        <a href="#sec-contact" class="block px-4 py-2.5 rounded-lg text-white/70 hover:text-white hover:bg-white/5 transition">İletişim &amp; Adres</a>
      </div>
    </aside>

    <!-- Sağ İçerik Alanı -->
    <div class="md:col-span-9 space-y-8">

      <!-- HERO BÖLÜMÜ -->
      <section id="sec-hero" class="bg-brand-card border border-brand-border rounded-xl p-6">
        <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">Hero (Ana Sayfa Giriş) Bilgileri</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Üst Slogan</label>
            <input type="text" id="hero-subheading" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="/ YENİ TARZ. YENİ SEN.">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs uppercase text-white/60 mb-1">Başlık (Satır 1 - Beyaz)</label>
              <input type="text" id="hero-title-1" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="TARZINI">
            </div>
            <div>
              <label class="block text-xs uppercase text-white/60 mb-1">Başlık (Satır 2 - Yeşil)</label>
              <input type="text" id="hero-title-2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="YÜKSELT">
            </div>
          </div>
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Açıklama Metni</label>
            <textarea id="hero-description" rows="2" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none">Erkeklerin yeni nesil duruşu. Özenli bakım, keskin stil.</textarea>
          </div>
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Hero Model Görseli (URL)</label>
            <input type="text" id="hero-image-url" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?q=80&w=1000&auto=format&fit=crop">
          </div>
        </div>
      </section>

      <!-- HİZMETLER BÖLÜMÜ -->
      <section id="sec-services" class="bg-brand-card border border-brand-border rounded-xl p-6">
        <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">Hizmet Başlıkları &amp; Açıklamaları</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="services-container">
          <!-- Dinamik olarak yüklenecek -->
        </div>
      </section>

      <!-- GALERİ BÖLÜMÜ -->
      <section id="sec-gallery" class="bg-brand-card border border-brand-border rounded-xl p-6">
        <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
          <h2 class="text-lg font-bold text-brand uppercase">Galeri Resimleri</h2>
          <button id="add-gallery-img" class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg transition">+ Yeni Resim Ekle</button>
        </div>
        <div id="gallery-container" class="space-y-3">
          <!-- Dinamik görsel URL alanları -->
        </div>
      </section>

      <!-- İLETİŞİM BÖLÜMÜ -->
      <section id="sec-contact" class="bg-brand-card border border-brand-border rounded-xl p-6">
        <h2 class="text-lg font-bold text-brand uppercase mb-4 border-b border-white/5 pb-2">İletişim &amp; Adres Bilgileri</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Telefon Numarası</label>
            <input type="text" id="contact-phone" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="0507 577 10 22">
          </div>
          <div>
            <label class="block text-xs uppercase text-white/60 mb-1">Çalışma Saatleri</label>
            <input type="text" id="contact-hours" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="Pzt–Cmt 09:00–21:00">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs uppercase text-white/60 mb-1">Açık Adres</label>
            <input type="text" id="contact-address" class="w-full bg-[#08080a] border border-brand-border rounded-lg p-3 text-sm focus:border-brand outline-none" value="Arda Mahallesi 3205 Sokak 18/B, Manisa">
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="admin.js"></script>
</body>
  </html>
